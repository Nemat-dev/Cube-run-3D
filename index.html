<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cube Runner 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #1a1a24;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Panel */
        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .stat-card {
            background: rgba(25, 25, 38, 0.8);
            border: 2px solid #45475a;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #f9e2af;
            backdrop-filter: blur(5px);
        }

        /* Overlay Menyular */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 17, 27, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .title {
            font-size: 36px;
            color: #f38ba8;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(243, 139, 168, 0.4);
        }

        .description {
            font-size: 14px;
            color: #bac2de;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.5;
        }

        .start-btn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #11111b;
            background: #a6e3a1;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(166, 227, 161, 0.4);
            transition: transform 0.1s;
        }

        .start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <div class="stat-card" id="scoreText">Masofa: 0m</div>
        <div class="stat-card" style="color: #f9e2af;" id="coinsText">🪙 0</div>
    </div>

    <div class="overlay" id="menuOverlay">
        <h1 class="title" id="menuTitle">SUBWAY RUNNER</h1>
        <p class="description" id="menuDesc">
            <b>Boshqaruv:</b><br>
            ⬅️ ➡️ - Chap/O'ngga o'tish<br>
            ⬆️ - Sakrash | ⬇️ - Enkayish<br>
            (Mobil ekranda Swipe barmog'ingiz bilan)
        </p>
        <button class="start-btn" id="startBtn" onclick="startGame()">BOSHLASH</button>
    </div>

    <!-- 3D Dvigatel: Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let player, playerBox;
        let lanes = [-2, 0, 2]; // 3 ta yo'lak koordinatasi
        let currentLane = 1; // Markaziy yo'lak
        
        let obstacles = [];
        let coins = [];
        let roadTiles = [];
        
        let score = 0;
        let coinCount = 0;
        let gameSpeed = 0.35;
        let isPlaying = false;

        // Player sakrash va enkayish parametrlari
        let isJumping = false;
        let jumpVelocity = 0;
        let isSliding = false;
        let slideTimer = 0;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);
            scene.fog = new THREE.Fog(0x1a1a24, 20, 70);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 7);
            camera.rotation.x = -0.2;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Yorug'liklar
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // O'yinchi (Qahramon)
            const playerGeo = new THREE.BoxGeometry(0.8, 1.6, 0.8);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0x89b4fa });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(lanes[currentLane], 0.8, 0);
            player.castShadow = true;
            scene.add(player);

            playerBox = new THREE.Box3();

            // Yo'laklar (Yo'l plitalari)
            for (let i = 0; i < 10; i++) {
                createRoadTile(-i * 10);
            }

            window.addEventListener('resize', onWindowResize);
        }

        function createRoadTile(zPos) {
            const group = new THREE.Group();
            
            // Asosiy asfalt yo'l
            const roadGeo = new THREE.PlaneGeometry(7, 10);
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x313244 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            group.add(road);

            // Yo'lak ajratgich chiziqlar
            [-1, 1].forEach(x => {
                const lineGeo = new THREE.PlaneGeometry(0.1, 10);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x45475a });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(x * 2, 0.01, 0);
                group.add(line);
            });

            group.position.z = zPos;
            scene.add(group);
            roadTiles.push(group);
        }

        function spawnObstacleOrCoin() {
            const lane = lanes[Math.floor(Math.random() * 3)];
            const zPos = -60;
            const type = Math.random();

            if (type < 0.4) {
                // Standart to'siq (Baland devor - sakrab o'tiladi)
                const geo = new THREE.BoxGeometry(1.6, 1.2, 0.8);
                const mat = new THREE.MeshLambertMaterial({ color: 0xf38ba8 });
                const obs = new THREE.Mesh(geo, mat);
                obs.position.set(lane, 0.6, zPos);
                obs.castShadow = true;
                obs.userData = { type: 'barrier' };
                scene.add(obs);
                obstacles.push(obs);
            } 
            else if (type < 0.7) {
                // Yuqori to'siq (Tepada - ostidan sirpanib o'tiladi)
                const geo = new THREE.BoxGeometry(1.6, 1.2, 0.8);
                const mat = new THREE.MeshLambertMaterial({ color: 0xf9e2af });
                const obs = new THREE.Mesh(geo, mat);
                obs.position.set(lane, 1.8, zPos);
                obs.castShadow = true;
                obs.userData = { type: 'high_barrier' };
                scene.add(obs);
                obstacles.push(obs);
            } 
            else {
                // Tanga Yaratish
                for (let i = 0; i < 3; i++) {
                    const coinGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
                    const coinMat = new THREE.MeshLambertMaterial({ color: 0xf9e2af });
                    const coin = new THREE.Mesh(coinGeo, coinMat);
                    coin.rotation.x = Math.PI / 2;
                    coin.position.set(lane, 0.6, zPos - (i * 1.5));
                    scene.add(coin);
                    coins.push(coin);
                }
            }
        }

        function update() {
            if (!isPlaying) return;

            score += 0.2;
            document.getElementById('scoreText').innerText = `Masofa: ${Math.floor(score)}m`;

            // Tezlashuv
            gameSpeed = 0.35 + (score / 2000);

            // Player lateral pozitsiyasini ravon almashtirish
            player.position.x += (lanes[currentLane] - player.position.x) * 0.2;

            // Sakrash mantiqi
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= 0.02;
                if (player.position.y <= 0.8) {
                    player.position.y = 0.8;
                    isJumping = false;
                }
            }

            // Enkayish mantiqi
            if (isSliding) {
                slideTimer--;
                if (slideTimer <= 0) {
                    player.scale.y = 1;
                    player.position.y = 0.8;
                    isSliding = false;
                }
            }

            // Yo'l plitalarini harakatlantirish
            roadTiles.forEach(tile => {
                tile.position.z += gameSpeed;
                if (tile.position.z > 10) {
                    tile.position.z -= 100;
                }
            });

            // To'siqlarni surish va toqnashuvni hisoblash
            playerBox.setFromObject(player);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += gameSpeed;

                const obsBox = new THREE.Box3().setFromObject(obs);
                if (playerBox.intersectsBox(obsBox)) {
                    gameOver();
                    return;
                }

                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Tangalarni yig'ish
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.position.z += gameSpeed;
                coin.rotation.z += 0.05;

                const coinBox = new THREE.Box3().setFromObject(coin);
                if (playerBox.intersectsBox(coinBox)) {
                    coinCount++;
                    document.getElementById('coinsText').innerText = `🪙 ${coinCount}`;
                    scene.remove(coin);
                    coins.splice(i, 1);
                    continue;
                }

                if (coin.position.z > 10) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            // Ob'ektlarni spavn qilish
            if (Math.random() < 0.03) {
                spawnObstacleOrCoin();
            }

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        // Boshqaruv Buyruqlari
        function moveLeft() {
            if (currentLane > 0) currentLane--;
        }

        function moveRight() {
            if (currentLane < 2) currentLane++;
        }

        function jump() {
            if (!isJumping && !isSliding) {
                isJumping = true;
                jumpVelocity = 0.35;
            }
        }

        function slide() {
            if (!isSliding && !isJumping) {
                isSliding = true;
                player.scale.y = 0.5;
                player.position.y = 0.4;
                slideTimer = 35;
            }
        }

        // Klaviaturani ushlash
        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
            if (e.key === 'ArrowUp' || e.key === 'w') jump();
            if (e.key === 'ArrowDown' || e.key === 's') slide();
        });

        // Mobil Swipe Usullari
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', e => {
            if (!isPlaying) return;
            let diffX = e.changedTouches[0].clientX - touchStartX;
            let diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30) moveRight();
                else if (diffX < -30) moveLeft();
            } else {
                if (diffY < -30) jump();
                else if (diffY > 30) slide();
            }
        });

        function startGame() {
            // Qayta sozlash
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];

            score = 0;
            coinCount = 0;
            currentLane = 1;
            player.position.set(lanes[currentLane], 0.8, 0);

            document.getElementById('coinsText').innerText = `🪙 0`;
            document.getElementById('menuOverlay').style.display = 'none';

            isPlaying = true;
            update();
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('menuTitle').innerText = "O'YIN TUGADI!";
            document.getElementById('menuDesc').innerHTML = `Masofa: <b>${Math.floor(score)}m</b><br>Toplangan tangalar: <b>🪙 ${coinCount}</b>`;
            document.getElementById('startBtn').innerText = "QAYTA O'YNASH";
            document.getElementById('menuOverlay').style.display = 'flex';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init3D();
        renderer.render(scene, camera);
    </script>
</body>
</html>
